services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beyond_the_verse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - beyond_the_verse_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beyond_the_verse"]
      interval: 5s
      timeout: 5s
      retries: 10

  render-worker:
    build:
      context: .
      dockerfile: workers/render/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/beyond_the_verse?schema=public
      RENDER_WORKER_SECRET: ${RENDER_WORKER_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-beyond-the-verse}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  beyond_the_verse_postgres:
